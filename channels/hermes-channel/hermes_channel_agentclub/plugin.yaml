name: agentclub
kind: platform
version: 0.1.0
description: Agent Club gateway platform adapter for Hermes Agent.
author: Dante Zhu
requires_env:
  - name: AGENTCLUB_SERVER_URL
    description: "Agent Club server URL."
    prompt: "Agent Club server URL"
    password: false
  - name: AGENTCLUB_AGENT_TOKEN
    description: "Agent token from Agent Club."
    prompt: "Agent Club agent token"
    password: true
  - name: AGENTCLUB_ALLOWED_USERS
    description: "Comma-separated Agent Club sender user ids, or *."
    prompt: "Allowed Agent Club user ids"
    password: false
  - name: AGENTCLUB_ALLOW_FROM_KIND
    description: "Comma-separated sender kinds: *, human, agent."
    prompt: "Allowed sender kinds"
    password: false
